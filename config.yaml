# geo2list configuration. Adding a category or an extra domain is a one-line change.

# Upstream files. The .sha256sum files published next to them verify every
# download; min_size_bytes rejects truncated downloads (today geosite.dat is
# about 70 MB and geoip.dat about 18 MB).
sources:
  geosite:
    url: https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat
    checksum_url: https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat.sha256sum
    min_size_bytes: 10000000
  geoip:
    url: https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat
    checksum_url: https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat.sha256sum
    min_size_bytes: 2000000

output:
  dir: lists
  # File extensions to publish. Every list is written once per extension with
  # byte-identical content (ru.txt and ru.lst are the same bytes); the
  # validator checks that the copies never diverge. Do not remove or rename a
  # published extension: clients reference the published paths.
  extensions: [txt, lst]
  # Merge adjacent and overlapping prefixes. This never changes the set of
  # matched addresses (verified by tests).
  aggregate_cidrs: true

safety:
  # The build fails and nothing is published when a file's line count changes
  # by more than this fraction compared with the previously published version
  # (0.30 = 30%)...
  max_change_ratio: 0.30
  # ...unless the change is at most this many lines, so that small lists are
  # not blocked by a handful of entries.
  small_change_lines: 10

# Output kinds (each written once per extension in output.extensions):
#   combined  domains, then IPv4 CIDRs, then IPv6 CIDRs   -> <name>.<ext>
#   domains   domains only                                 -> <name>-domains.<ext>
#   ipv4      IPv4 CIDRs only                              -> <name>-ipv4.<ext>
#   ipv6      IPv6 CIDRs only                              -> <name>-ipv6.<ext>
# Category codes are matched case-insensitively.
lists:
  - name: ru
    geosite: [category-ru]
    geoip: [ru]
    extra_domains: [dion.vc, inno.tech, inno.local]
    outputs: [combined, domains, ipv4, ipv6]

  - name: telegram
    geosite: [telegram]
    geoip: [telegram]
    outputs: [combined, domains, ipv4, ipv6]

  - name: youtube
    geosite: [youtube]
    outputs: [combined]

  - name: ip-geo-detect
    geosite: [category-ip-geo-detect]
    outputs: [combined]
